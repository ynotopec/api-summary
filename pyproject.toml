[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "api-summary"
version = "0.1.0"
description = "Persistent asynchronous document summaries over REST and MCP with OIDC"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.31,<1", "httpx>=0.28,<1",
  "mcp>=1.30,<2", "pydantic-settings>=2.5,<3", "PyJWT[crypto]>=2.10,<3",
  "pdfplumber>=0.11,<1", "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
include = ["api_summary*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
